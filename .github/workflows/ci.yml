name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  notebook-smoke:
    name: Notebook smoke test (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbformat and pytest
        run: pip install nbformat pytest

      - name: Validate notebook structure
        run: |
          python - <<'EOF'
          import nbformat, pathlib, sys

          notebooks = sorted(pathlib.Path(".").rglob("*.ipynb"))
          errors = []

          # The course notebooks live in the Appendix topic folders. Finding none there
          # means the layout moved again and this check would pass on nothing.
          if not any(nb.parts[0] == "appendix" for nb in notebooks):
              print("❌ No notebooks found under appendix/")
              sys.exit(1)

          for nb_path in notebooks:
              try:
                  nb = nbformat.read(str(nb_path), as_version=4)
                  nbformat.validate(nb)
                  code_cells = [c for c in nb.cells if c.cell_type == "code"]
                  markdown_cells = [c for c in nb.cells if c.cell_type == "markdown"]
                  print(f"✅ {nb_path}  ({len(code_cells)} code, {len(markdown_cells)} markdown cells)")
              except Exception as e:
                  errors.append(f"❌ {nb_path}: {e}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"\n{len(notebooks)} notebooks validated.")
          EOF

      # Valid JSON says nothing about whether a notebook can run from its folder. This
      # evaluates each notebook's and script's load_dotenv and sys.path setup where it
      # sits, so a path one level off after a move fails here, not on a missing API key.
      - name: Notebooks and scripts reach shared/ and the root .env from their folders
        run: pytest tests/test_appendix_paths.py -v

  structure-check:
    name: Repo structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          python - <<'EOF'
          import pathlib, sys

          required = [
              "README.md",
              "SETUP.md",
              "CONTRIBUTING.md",
              "requirements.txt",
              ".env.example",
              ".gitignore",
          ]
          # Every Appendix topic folder (tests/test_repo_layout.py keeps the same list).
          topics = [
              "foundations", "prompt-engineering", "rag", "fine-tuning", "evaluation",
              "deployment", "optimization", "agent-frameworks", "observability",
              "evalops", "guardrails", "memory", "context-engineering", "agent-harness",
              "mcp", "multimodal", "graph-engineering", "typescript",
          ]
          non_python = {"typescript"}

          missing = []

          for f in required:
              if not pathlib.Path(f).exists():
                  missing.append(f"Missing root file: {f}")

          if not pathlib.Path("appendix/README.md").exists():
              missing.append("Missing Appendix index: appendix/README.md")

          for topic in topics:
              folder = pathlib.Path("appendix") / topic
              if not folder.is_dir():
                  missing.append(f"Missing Appendix topic: {folder}")
                  continue
              needed = ["README.md"] if topic in non_python else ["README.md", "requirements.txt"]
              for req in needed:
                  if not (folder / req).exists():
                      missing.append(f"Missing {folder}/{req}")

          numbered = sorted(p.name for p in pathlib.Path(".").glob("[0-9][0-9]-*") if p.is_dir())
          if numbered:
              missing.append(f"Numbered module folders belong in appendix/: {numbered}")

          if missing:
              print("\n".join(missing))
              sys.exit(1)

          print("✅ All required files present")
          EOF

  unit-tests:
    name: Unit tests (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Everything tests/ imports beyond the standard library (tests/test_ci_installs.py
      # checks this line against those imports). python-dotenv reads .env.example the
      # way the Appendix notebooks read a Reader's .env. mcp is the MCP Python SDK the
      # Appendix example server runs on (tests/test_appendix_mcp_frameworks.py).
      # opentelemetry-sdk traces every Case run (company/tracing.py, Spine 4).
      - name: Install dependencies
        run: pip install pytest tiktoken python-dotenv "mcp>=2.2" opentelemetry-sdk

      - name: Run tests
        run: pytest tests/ -v

      # The Offline Checks: every Spine module's suite against the reference
      # Flagship Agent, replayed from the reviewed recordings. No key, no
      # network and no secrets, so a regression fails the PR for any contributor.
      - name: Offline Checks (every Spine module, no API key)
        run: python -m checks --mode offline

      - name: Stale-reference lint (retired model IDs and dead APIs)
        run: pytest tests/test_stale_references.py -v

      - name: Appendix layout and internal link check
        run: pytest tests/test_repo_layout.py -v
